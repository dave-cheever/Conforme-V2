parameters:
  - name: adoEnvironment
    type: string
  - name: variableGroup
    type: string
  - name: variableFunctionGroup
    type: string
  - name: reactAppName
    type: string
  - name: expressAppName
    type: string
  - name: functionAppName
    type: string
  - name: resourceGroupName
    type: string
  - name: location
    type: string
    default: 'uksouth'
  - name: bicepPath
    type: string
    default: 'Pipelines/bicep/main.bicep'
  - name: parametersFile
    type: string
    default: 'Pipelines/bicep/main.parameters.json'
  - name: cosmosAccountName
    type: string
    default: ''
  - name: cosmosDbName
    type: string
    default: ''
  - name: cosmosAccountIsExisting
    type: boolean
    default: false
  - name: appServicePlanName
    type: string
    default: ''
  - name: storageAccountName
    type: string
    default: ''
  - name: tags
    type: string
    default: '{"Product":"Conforme"}'
  - name: appServiceConnection
    type: string

jobs:
- deployment: Provision_Infrastructure
  displayName: '${{ parameters.adoEnvironment }} Infrastructure (Bicep)'
  variables:
    - group: ${{ parameters.variableGroup }}
    - group: ${{ parameters.variableFunctionGroup }}
  environment: '${{ parameters.adoEnvironment }}'
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
          persistCredentials: true
          clean: true
        - task: AzureCLI@2
          displayName: 'Deploy Bicep to ${{ parameters.resourceGroupName }}'
          inputs:
            azureSubscription: '${{ parameters.appServiceConnection }}'
            workingDirectory: '$(Build.SourcesDirectory)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -eo pipefail

              # Create/ensure resource group
              az group create -n "${{ parameters.resourceGroupName }}" -l "${{ parameters.location }}"

              # Show key variables (redacted for secrets)
              echo "Environment: ${{ parameters.adoEnvironment }}"
              echo "RG: ${{ parameters.resourceGroupName }}"
              echo "Location: ${{ parameters.location }}"
              echo "Client App: ${{ parameters.reactAppName }}"
              echo "API App: ${{ parameters.expressAppName }}"
              echo "Func App: ${{ parameters.functionAppName }}"
              echo "Cosmos Account: ${{ parameters.cosmosAccountName }}"
              echo "Storage Account: ${{ parameters.storageAccountName }}"

              # (App/runtime parameters removed; no validation needed here)

              # Detect if Cosmos account already exists in the target RG
              COSMOS_EXISTS=false
              if az cosmosdb show -g "${{ parameters.resourceGroupName }}" -n "${{ parameters.cosmosAccountName }}" --only-show-errors >/dev/null 2>&1; then
                COSMOS_EXISTS=true
              fi
              echo "Cosmos exists: ${COSMOS_EXISTS}"

              # Deploy group-scoped template
              az deployment group create \
                -g "${{ parameters.resourceGroupName }}" \
                -f "${{ parameters.bicepPath }}" \
                -p @"${{ parameters.parametersFile }}" \
                -p \
                  location="${{ parameters.location }}" \
                  tags='${{ parameters.tags }}' \
                  appServicePlanName='${{ parameters.appServicePlanName }}' \
                  appServicePlanSku="${APP_SERVICE_PLAN_SKU:-B1}" \
                  webAppNameClient="${{ parameters.reactAppName }}" \
                  webAppNameAPI="${{ parameters.expressAppName }}" \
                  functionAppName="${{ parameters.functionAppName }}" \
                  cosmosAccountName='${{ parameters.cosmosAccountName }}' \
                  cosmosAccountIsExisting=${COSMOS_EXISTS} \
                  cosmosDbName='${{ parameters.cosmosDbName }}' \
                  storageAccountName='${{ parameters.storageAccountName }}' \
                  createFunctionAppInsights=true \
                --verbose --debug

