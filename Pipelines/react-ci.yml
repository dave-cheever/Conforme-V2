pr:
  branches:
    include:
      - main

trigger: none

pool:
  vmImage: ubuntu-latest

jobs:


- job: 'Insert_automation_IDs'
  
  steps:
  - checkout: self
    persistCredentials: true
  - task: NodeTool@0
    displayName: 'Set Node Version'
    inputs:
      versionSource: 'spec'
      versionSpec: '22.x'
      checkLatest: true
  - task: Npm@1
    displayName: 'Install dependencies'
    inputs:
      command: 'install'
      workingDir: 'React'

  - script: |
      git config --global user.email "pipeline@azure.com"
      git config --global user.name "Azure Pipeline"
    displayName: 'Configure Git'

  - script: |
      if [ -n "$(git status --porcelain)" ]; then
        echo "File changes detected, checking if they are meaningful..."
        
        # Check if there are any non-whitespace changes
        git add .
        if git diff --cached --ignore-all-space --ignore-blank-lines --quiet; then
          echo "Only whitespace changes detected, skipping commit"
          git reset HEAD .
          echo "##vso[task.setvariable variable=CodeChanged]false"
        else
          echo "Meaningful changes detected, creating commit..."
          
          # Get the PR source branch
          TARGET_BRANCH="$(System.PullRequest.SourceBranch)"
          echo "Target branch: $TARGET_BRANCH"
          
          # Extract branch name without refs/heads/ prefix
          BRANCH_NAME="${TARGET_BRANCH#refs/heads/}"
          echo "Branch name: $BRANCH_NAME"
          
          # Fetch latest changes and checkout the source branch
          git fetch origin
          git checkout $BRANCH_NAME
          git pull origin $BRANCH_NAME
          
          # Re-add our changes on the actual branch (since we switched branches)
          git add .
          git commit -m "Auto-insert automation IDs [skip ci]"
          
          # Push the changes
          git push origin $BRANCH_NAME
          
          echo "##vso[task.setvariable variable=CodeChanged]true"
        fi
      else
        echo "No changes detected"
        echo "##vso[task.setvariable variable=CodeChanged]false"
      fi
    displayName: 'Commit automation changes if any'

- job: 'Execute_unit_tests'
  dependsOn: 'Insert_automation_IDs'
  steps:
  - task: NodeTool@0
    displayName: 'Set Node Version'
    inputs:
      versionSource: 'spec'
      versionSpec: '22.x'
      checkLatest: true

  - task: Npm@1
    displayName: 'Install dependencies'
    inputs:
      command: 'install'
      workingDir: 'React'

  - task: Npm@1
    displayName: 'Execute unit tests'
    inputs:
      command: 'custom'
      workingDir: 'React'
      customCommand: 'run test'

# - job: 'Run SonarQube analysis'

- job: 'Build_React_App'
  dependsOn: 'Insert_automation_IDs'
  steps:
  - task: NodeTool@0
    displayName: 'Set Node Version'
    inputs:
      versionSource: 'spec'
      versionSpec: '22.x'
      checkLatest: true

  - task: Npm@1
    displayName: 'Install dependencies'
    inputs:
      command: 'install'
      workingDir: 'React'

  - task: Npm@1
    displayName: 'Build the app'
    inputs:
      command: 'custom'
      workingDir: 'React'
      customCommand: 'run build'
