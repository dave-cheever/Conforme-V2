trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - '*.*.*'

pr: none

name: $(Build.SourceBranchName)
# appendCommitMessageToRunName: false

variables:
  - group: Conforme SIT
  - name: Node_Version
    value: '22.x'
  - name: React_WorkingDir
    value: 'React'
  - name: Express_WorkingDir
    value: 'Express'
  - name: Functions_WorkingDir
    value: 'Azure Functions'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: 'Build_Artifacts'
  displayName: 'Build'
  jobs:
  
  - job: Set_Run_Name
    displayName: 'Set pipeline run name to release number'
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
      fetchDepth: 0
    - task: Bash@3
      displayName: 'Set run name from tag (or compute fallback)'
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail

          # If triggered by a tag, use it directly as the release number
          if [[ "${BUILD_SOURCEBRANCH:-}" == refs/tags/* ]]; then
            NEW_TAG="${BUILD_SOURCEBRANCH#refs/tags/}"
          else
            # Fallback: compute next SemVer patch locally without creating a tag
            git fetch --tags --force
            LAST_TAG=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              LAST_TAG="0.0.0"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
            PATCH=$((PATCH+1))
            NEW_TAG="$MAJOR.$MINOR.$PATCH"
          fi

          echo "Release: $NEW_TAG"
          echo "##vso[task.setvariable variable=VERSION]$NEW_TAG"
          echo "##vso[build.updatebuildnumber]$NEW_TAG"

  - job: Build_React
    displayName: 'Build React App'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node $(Node_Version)'
      inputs:
        versionSource: 'spec'
        versionSpec: '$(Node_Version)'
        checkLatest: true
    - task: Npm@1
      displayName: 'Install React dependencies'
      inputs:
        command: 'install'
        workingDir: '$(React_WorkingDir)'
    - task: Npm@1
      displayName: 'Build React'
      inputs:
        command: 'custom'
        workingDir: '$(React_WorkingDir)'
        customCommand: 'run build'
    - task: ArchiveFiles@2
      displayName: 'Archive React build'
      inputs:
        rootFolderOrFile: '$(React_WorkingDir)/build'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/react-app/react-app.zip'
        replaceExistingArchive: true
    - task: PublishBuildArtifacts@1
      displayName: 'Publish React artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/react-app'
        ArtifactName: 'react-app'
        publishLocation: 'Container'

  - job: Build_Express
    displayName: 'Build Express App'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node $(Node_Version)'
      inputs:
        versionSource: 'spec'
        versionSpec: '$(Node_Version)'
        checkLatest: true
    - task: Npm@1
      displayName: 'Install Express dependencies'
      inputs:
        command: 'install'
        workingDir: '$(Express_WorkingDir)'
    - task: Npm@1
      displayName: 'Build Express'
      inputs:
        command: 'custom'
        workingDir: '$(Express_WorkingDir)'
        customCommand: 'run build -- --env NODE_ENV=production'
    - task: CopyFiles@2
      displayName: 'Copy required files'
      inputs:
        SourceFolder: '$(Express_WorkingDir)'
        Contents: |
          public/**
          wkhtmltox_0.12.6-0.20180618.3.dev.e6d6f54.stretch_amd64.deb
          startServer.sh
        TargetFolder: '$(Express_WorkingDir)/build'
    - task: CopyFiles@2
      displayName: 'Stage Express output'
      inputs:
        SourceFolder: '$(Express_WorkingDir)'
        Contents: |
          package.json
          package-lock.json
          build/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)/express/stage'
    - task: ArchiveFiles@2
      displayName: 'Archive Express build'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/express/stage/build'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/express/express-app.zip'
        replaceExistingArchive: true
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Express artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/express'
        ArtifactName: 'express-app'
        publishLocation: 'Container'

  - job: Build_Functions
    displayName: 'Build Function App'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node $(Node_Version)'
      inputs:
        versionSource: 'spec'
        versionSpec: '$(Node_Version)'
        checkLatest: true
    - task: Npm@1
      displayName: 'Install Functions dependencies'
      inputs:
        command: 'install'
        workingDir: '$(Functions_WorkingDir)'
    - task: Npm@1
      displayName: 'Build Functions'
      inputs:
        command: 'custom'
        workingDir: '$(Functions_WorkingDir)'
        customCommand: 'run build'
    - task: CopyFiles@2
      displayName: 'Stage Function output'
      inputs:
        SourceFolder: '$(Functions_WorkingDir)'
        Contents: |
          host.json
          package.json
          package-lock.json
          dist/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)/functions/stage'
    - task: ArchiveFiles@2
      displayName: 'Archive Function app'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/functions/stage'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/functions/function-app.zip'
        replaceExistingArchive: true
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Functions artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/functions'
        ArtifactName: 'function-app'
        publishLocation: 'Container'

- stage: Deploy_SIT_Current
  displayName: 'SIT V2'
  dependsOn: Build_Artifacts
  condition: and(succeeded(), startsWith(variables['Build.SourceBranchName'], '2'))
  jobs:
    - template: templates/deploy-environment.yml
      parameters:
        adoEnvironment: 'Conforme - SIT'
        variableGroup: 'Conforme SIT V2'
        variableFunctionGroup: 'Conforme Functions SIT'
        azureSubscription: '$(APP_SERVICE_CONNECTION)'
        reactAppName: 'conforme-sit'
        expressAppName: 'conforme-api-sit'
        functionAppName: 'conforme-functions-sit'
        resourceGroupName: 'rg-conforme-web-sit'
        runtimeStack: 'NODE|22-lts'
        location: 'uksouth'
 
- stage: Deploy_SIT_Next
  displayName: 'SIT V3'
  dependsOn: Build_Artifacts
  condition: and(succeeded(), startsWith(variables['Build.SourceBranchName'], '3'))
  jobs:
    - template: templates/deploy-environment.yml
      parameters:
        adoEnvironment: 'Conforme - SIT'
        variableGroup: 'Conforme SIT'
        variableFunctionGroup: 'Conforme Functions SIT'
