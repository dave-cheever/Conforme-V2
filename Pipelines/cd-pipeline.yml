    - Deploy_SAT_Next
  condition: or(eq(dependencies.Deploy_SAT_Current.result, 'Succeeded'), eq(dependencies.Deploy_SAT_Next.result, 'Succeeded'))
  jobs:
    - template: templates/deploy-environment.yml
      parameters:
        adoEnvironment: 'Conforme - Document Control UAT'
        variableGroup: 'Conforme - Document Control UAT'
        variableFunctionGroup: 'Conforme - Document Control Functions UAT'
        azureSubscription: '$(APP_SERVICE_CONNECTION)'
