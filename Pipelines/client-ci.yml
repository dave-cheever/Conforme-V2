pr:
  branches:
    include:
      - main

trigger: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Insert_automation_IDs
    steps:
      - checkout: self
        persistCredentials: true

      - task: NodeTool@0
        displayName: Set Node Version
        inputs:
          versionSource: spec
          versionSpec: 22.x
          checkLatest: true

      - task: Npm@1
        displayName: Install dependencies
        inputs:
          command: install
          workingDir: React

      - script: |
          git config --global user.email "pipeline@azure.com"
          git config --global user.name "Azure Pipeline"
        displayName: Configure Git

      - script: npx jscodeshift -t React/insert-id.ts React/src/
        displayName: Run automation ID insertion script

      - script: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "File changes detected, checking if they are meaningful..."

            git add .
            if git diff --cached --ignore-all-space --ignore-blank-lines --quiet; then
              echo "Only whitespace changes detected, skipping commit"
              git reset HEAD .
              echo "##vso[task.setvariable variable=CodeChanged]false"
            else
              echo "Meaningful changes detected, creating commit..."

              TARGET_BRANCH="$(System.PullRequest.SourceBranch)"
              echo "Target branch: $TARGET_BRANCH"

              BRANCH_NAME="${TARGET_BRANCH#refs/heads/}"
              echo "Branch name: $BRANCH_NAME"

              git fetch origin
              git checkout "$BRANCH_NAME"
              git pull origin "$BRANCH_NAME"

              git add .
              git commit -m "Auto-insert automation IDs [skip ci]"
              git push origin "$BRANCH_NAME"

              echo "##vso[task.setvariable variable=CodeChanged]true"
            fi
          else
            echo "No changes detected"
            echo "##vso[task.setvariable variable=CodeChanged]false"
          fi
        displayName: Commit automation changes if any

  - job: SonarQube_Analysis
    displayName: Execute tests & run SonarCloud analysis
    steps:
      - checkout: self
        fetchDepth: 0

      - task: SonarCloudPrepare@3
        displayName: Prepare SonarCloud
        inputs:
          SonarCloud: sonarqube-conforme # service connection name (SonarCloud, not SonarQube)
          organization: cielo-costa
          scannerMode: cli
          configMode: manual
          cliProjectKey: cielocosta-projects_Conforme-V2
          cliProjectName: Conforme V2

      - task: NodeTool@0
        displayName: Set Node Version
        inputs:
          versionSource: spec
          versionSpec: 22.x
          checkLatest: true

      - task: Npm@1
        displayName: Install dependencies
        inputs:
          command: install
          workingDir: React

      - task: Npm@1
        displayName: Build the app
        inputs:
          command: custom
          workingDir: React
          customCommand: run build

      - task: Npm@1
        displayName: Generate coverage for SonarQube
        inputs:
          command: custom
          workingDir: React
          customCommand: run test:ci

      - script: |
          echo "=== Coverage File Verification ==="
          echo "Current directory: $(pwd)"
          ls -la React/coverage/ || echo "Coverage directory not found"
          if [ -f "React/coverage/lcov.info" ]; then
            echo "✅ Coverage file found!"
            echo "File size: $(wc -c < React/coverage/lcov.info) bytes"
            head -20 React/coverage/lcov.info || true
            grep -A 5 -B 2 "sanitizeDisplayName" React/coverage/lcov.info || echo "sanitizeDisplayName not found in coverage"
          else
            echo "❌ Coverage file not found!"
            ls -la React/ || echo "React directory not found"
            exit 1
          fi
        displayName: Verify coverage file exists and show content

      - task: SonarCloudAnalyze@3
        displayName: Run SonarCloud analysis (scan)
        inputs:
          jdkversion: JAVA_HOME_17_X64

      - task: SonarCloudPublish@3
        displayName: Publish SonarCloud quality gate result
        inputs:
          pollingTimeoutSec: 300
