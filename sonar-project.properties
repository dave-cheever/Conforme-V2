sonar.projectKey=cielocosta-projects_Conforme-V2
sonar.organization=cielo-costa

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Conforme V2
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Coverage configuration
sonar.javascript.lcov.reportPaths=React/coverage/lcov.info
sonar.typescript.lcov.reportPaths=React/coverage/lcov.info

# Show overall coverage, not just new code coverage
sonar.coverage.reportPaths=React/coverage/lcov.info
sonar.typescript.coverage.reportPaths=React/coverage/lcov.info

# Exclude node_modules and build directories and test files from all analysis
# Exclude from static analysis (code smells, bugs, vulnerabilities)
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/dist/**,**/*.test.*,**/**_tests/**/*,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/setupTests.ts,**/__tests__/**,**/_tests__/**

# Exclude from test coverage calculation
sonar.coverage.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/dist/**,**/*.test.*,**/**_tests/**/*,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/setupTests.ts,**/__tests__/**,**/_tests__/**

# Exclude from code duplication detection
sonar.cpd.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/dist/**,**/*.test.*,**/**_tests/**/*,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/setupTests.ts,**/__tests__/**,**/_tests__/**
